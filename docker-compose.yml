services:
  # Core Scientific Agent API: Orchestrates multi-agent tasks, STO-IV verifier, and QSAR inference
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pharmaforge:latest
    container_name: pharmaforge-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
      - ENVIRONMENT=production
    volumes:
      - ./src:/app/src
      - ./api:/app/api
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./scripts:/app/scripts
      - ./skills_cache:/app/skills_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - pharmaforge-net

  # Interactive Streamlit Scientific Dashboard
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: pharmaforge:latest
    container_name: pharmaforge-ui
    restart: unless-stopped
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - PYTHONPATH=/app/src
    volumes:
      - ./ui:/app/ui
      - ./src:/app/src
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./scripts:/app/scripts
      - ./skills_cache:/app/skills_cache
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pharmaforge-net

networks:
  pharmaforge-net:
    driver: bridge
